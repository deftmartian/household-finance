version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: '05:17'
      timezone: America/Halifax
    allow:
      - dependency-name: '@actual-app/api'
    cooldown:
      exclude:
        - '@actual-app/api'
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:37'
      timezone: America/Halifax
    open-pull-requests-limit: 2
