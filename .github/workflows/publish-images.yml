name: Publish container images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify application
        run: pnpm verify

  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: household-finance-bot
            target: finance-runtime
          - image: household-finance-document-preparer
            target: document-preparer-runtime
          - image: household-finance-actual-reader
            target: actual-reader-runtime
          - image: household-finance-actual-writer
            target: actual-writer-runtime
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Record published digest
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf -- '- `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  promote-latest:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the verified image set to latest
        shell: bash
        env:
          REGISTRY_PREFIX: ghcr.io/${{ github.repository_owner }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          images=(
            household-finance-bot
            household-finance-document-preparer
            household-finance-actual-reader
            household-finance-actual-writer
          )
          digests=()

          # Resolve the complete immutable set before moving any rolling tag.
          for image in "${images[@]}"; do
            commit_ref="${REGISTRY_PREFIX}/${image}:${REVISION}"
            manifest="$(docker buildx imagetools inspect "$commit_ref" --format '{{json .Manifest}}')"
            digest="$(jq -r '.digest // empty' <<<"$manifest")"
            labels="$(docker buildx imagetools inspect "$commit_ref" --format '{{json .Image.Config.Labels}}')"
            if
              [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
                ! jq -e '
                  .mediaType == "application/vnd.oci.image.index.v1+json" and
                  ([
                    .manifests[] |
                    select(.platform.os == "linux" and .platform.architecture == "amd64")
                  ] | length) == 1 and
                  ([
                    .manifests[] |
                    select(
                      (.platform.os == "linux" and .platform.architecture == "amd64") or
                      (
                        .platform.os == "unknown" and
                        .platform.architecture == "unknown" and
                        .annotations["vnd.docker.reference.type"] == "attestation-manifest"
                      )
                    )
                  ] | length) == (.manifests | length)
                ' <<<"$manifest" >/dev/null ||
                ! jq -e --arg revision "$REVISION" '
                  .["org.opencontainers.image.revision"] == $revision
                ' <<<"$labels" >/dev/null
            then
              echo "Invalid platform, digest, attestation, or revision metadata for ${commit_ref}" >&2
              exit 1
            fi
            digests+=("$digest")
          done

          for index in "${!images[@]}"; do
            image_ref="${REGISTRY_PREFIX}/${images[$index]}"
            docker buildx imagetools create \
              --tag "${image_ref}:latest" \
              "${image_ref}@${digests[$index]}"
          done

          {
            echo '### Promoted latest image set'
            echo
            for index in "${!images[@]}"; do
              image_ref="${REGISTRY_PREFIX}/${images[$index]}"
              latest_digest="$(docker buildx imagetools inspect "${image_ref}:latest" --format '{{.Manifest.Digest}}')"
              if [[ "$latest_digest" != "${digests[$index]}" ]]; then
                echo "Latest digest mismatch for ${image_ref}" >&2
                exit 1
              fi
              printf -- '- `%s:latest` -> `%s@%s`\n' \
                "$image_ref" "$image_ref" "$latest_digest"
            done
          } >> "$GITHUB_STEP_SUMMARY"
