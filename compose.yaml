name: household-finance
services:
  finance-bot:
    image: ${FINANCE_IMAGE:-household-finance:local}
    pull_policy: if_not_present
    restart: unless-stopped
    user: 1000:1000
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./config/document-seccomp.json
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 150s
    environment:
      FINANCE_CONFIG: /run/secrets/finance_config
    secrets:
      - finance_config
      - xai_api_key
      - talk_bot_secret
      - nextcloud_app_password
      - actual_server_password
    volumes:
      - finance-data:/data
    networks:
      finance-internal: null
      finance-edge: null
    dns:
      - ${DNS_SERVER:-192.168.1.1}
    expose:
      - '4380'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4380/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    labels:
      com.getarcaneapp.arcane.updater: 'false'
    build:
      context: .
      target: finance-runtime
  actual-server:
    image: actualbudget/actual-server:26.9.0
    pull_policy: always
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 30s
    environment:
      ACTUAL_CONFIG_PATH: /run/secrets/actual_oidc_config.json
    secrets:
      - source: actual_oidc_config
        target: actual_oidc_config.json
    volumes:
      - type: volume
        source: actual-data
        target: /data
        volume:
          nocopy: true
    networks:
      finance-internal:
        aliases:
          - actual-server
      finance-edge: null
    dns:
      - ${DNS_SERVER:-192.168.1.1}
    expose:
      - '5006'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5006').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 6
    labels:
      com.getarcaneapp.arcane.updater: 'false'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  finance-internal:
    driver: bridge
    internal: true
  finance-edge:
    driver: bridge
volumes:
  actual-data: null
  finance-data: null
secrets:
  xai_api_key:
    file: ${XAI_API_KEY_SOURCE:-../_secrets/household-finance/xai_api_key.txt}
  talk_bot_secret:
    file: ${TALK_BOT_SECRET_SOURCE:-../_secrets/household-finance/talk_bot_secret.txt}
  nextcloud_app_password:
    file: ${NEXTCLOUD_APP_PASSWORD_SOURCE:-../_secrets/household-finance/nextcloud_app_password.txt}
  actual_server_password:
    file: ${ACTUAL_SERVER_PASSWORD_SOURCE:-../_secrets/household-finance/actual_server_password.txt}
  actual_oidc_config:
    file: ${ACTUAL_OIDC_CONFIG_SOURCE:-../_secrets/household-finance/actual_oidc_config.json}
  finance_config:
    file: ${FINANCE_CONFIG_SOURCE:?Set the private replacement configuration file}
